<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Report Waste</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#f2faf6;
}

/* NAV */
nav{
background:#0f6d46;
color:white;
display:flex;
justify-content:space-between;
padding:16px 40px;
}

nav a{
color:white;
text-decoration:none;
margin-left:18px;
font-weight:bold;
}

/* CARD */
.container{
max-width:720px;
margin:40px auto;
background:white;
padding:30px;
border-radius:16px;
box-shadow:0 8px 20px rgba(0,0,0,.12);
}

h2{
text-align:center;
color:#158f5a;
margin-bottom:20px;
}

input,select,textarea{
width:100%;
padding:12px;
margin:10px 0;
border-radius:8px;
border:1px solid #ccc;
}

button{
background:#158f5a;
color:white;
border:none;
padding:14px;
border-radius:10px;
font-weight:bold;
cursor:pointer;
width:100%;
margin-top:10px;
}

/* EXCEL BOX */
.excelBox{
margin-top:20px;
padding:16px;
background:#e9f7f1;
border-radius:12px;
text-align:center;
}

/* TABLE */
table{
width:95%;
margin:30px auto;
border-collapse:collapse;
background:white;
}

th,td{
border:1px solid #ddd;
padding:10px;
text-align:center;
}

th{
background:#158f5a;
color:white;
}

footer{
background:#0f6d46;
color:white;
text-align:center;
padding:16px;
margin-top:40px;
}
</style>
</head>

<body>


<nav>
<div>♻ Smart Waste City</div>
<div>
<a href="home.html">Home</a>
<a href="report.html">Report Waste</a>
<a href="binstatus.html">Bin Status</a>
<a href="recycle.html">Recycle and Use</a>
<a href="login.html">Admin</a>
</div>
</nav>


<div class="container">
<h2>Report Waste</h2>

<form id="wasteForm">

<input id="nameInput" required placeholder="Your Name">
<input id="mobileInput" required placeholder="Mobile Number">

<select id="zoneInput">
<option>MIDC Area</option>
<option>TC College Area</option>
<option>VP College Area</option>
<option>Railway Station</option>
<option>Bus Station</option>
<option>Kasba Area</option>
<option>Silver Jubilee Hospital</option>
</select>

<select id="typeInput">
<option>Plastic</option>
<option>Dry</option>
<option>Wet</option>
<option >Mixed</option>
</select>

<select id="urgencyInput">
<option>Low</option>
<option>Medium</option>
<option>High</option>
</select>

<textarea id="locationInput" placeholder="Exact Location"></textarea>

<button type="submit">Submit Report</button>

</form>

<div class="excelBox">
<h3>Excel Database</h3>
<input type="file" id="excelFile">
<button type="button" onclick="importExcel()">Import Excel</button>
<button type="button" onclick="exportExcel()">Export Excel</button>
</div>

</div>


<table>
<thead>
<tr>
<th>BIN ID</th>
<th>Zone</th>
<th>Type</th>
<th>Urgency</th>
<th>Location</th>
<th>Status</th>
<th>Time</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>

<footer>
Smart City — Waste Reporting Module
</footer>

<script>

let reports =
JSON.parse(localStorage.getItem("wasteReports")) || [];

const tbody =
document.getElementById("tbody");


function makeBinID(){
return "BINID-" + Math.floor(Math.random()*1000000);
}


document.getElementById("wasteForm").onsubmit = function(e){
e.preventDefault();

const r = {
ID: makeBinID(),
Name: nameInput.value,     
Mobile: mobileInput.value, 
Zone: zoneInput.value,
Type: typeInput.value,
Urgency: urgencyInput.value,
Location: locationInput.value,
Status: "Pending",
Time: new Date().toLocaleString()
};

reports.push(r);
save();
this.reset();
alert("Report Submitted");
};


function save(){
localStorage.setItem(
"wasteReports",
JSON.stringify(reports)
);
render();
}


function render(){
tbody.innerHTML = "";

reports.forEach(r=>{
tbody.innerHTML += `
<tr>
<td>${r.ID}</td>
<td>${r.Zone}</td>
<td>${r.Type}</td>
<td>${r.Urgency}</td>
<td>${r.Location}</td>
<td>${r.Status}</td>
<td>${r.Time}</td>
</tr>`;
});
}

render();


function importExcel(){
const file = excelFile.files[0];
if(!file){ alert("Choose file"); return; }

const reader = new FileReader();

reader.onload = e=>{
const data = new Uint8Array(e.target.result);
const wb = XLSX.read(data,{type:"array"});
const ws = wb.Sheets[wb.SheetNames[0]];
const json = XLSX.utils.sheet_to_json(ws);

reports = reports.concat(json);
save();
alert("Excel Imported");
};

reader.readAsArrayBuffer(file);
}


function exportExcel(){
const ws = XLSX.utils.json_to_sheet(reports);
const wb = XLSX.utils.book_new();
XLSX.utils.book_append_sheet(wb,ws,"Reports");
XLSX.writeFile(wb,"waste_reports.xlsx");
}

</script>

</body>
</html>
