<!DOCTYPE html>
<html>
<head>
<title>City Bin Status</title>

<style>
body{
font-family:Arial;
background:#f2faf6;
padding:25px;
}

nav{
background:#0f6d46;
color:white;
padding:15px 30px;
display:flex;
justify-content:space-between;
}

nav a{
color:white;
text-decoration:none;
margin-left:15px;
font-weight:bold;
}

h2{
text-align:center;
color:#0f6d46;
margin:20px 0;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:18px;
}

.card{
background:white;
padding:16px;
border-radius:14px;
box-shadow:0 6px 14px rgba(0,0,0,.12);
}

.binid{
font-weight:bold;
font-size:16px;
color:#158f5a;
}

.area{
color:#444;
margin:4px 0;
}

.type{
display:inline-block;
background:#e9f7f1;
padding:4px 8px;
border-radius:6px;
font-size:13px;
margin-bottom:6px;
}

.status{
font-weight:bold;
margin:6px 0;
}

img{
width:100%;
height:150px;
object-fit:cover;
border-radius:10px;
margin-top:8px;
}

input[type=file]{
margin-top:8px;
}

button{
margin-top:8px;
padding:8px;
width:100%;
border:none;
border-radius:8px;
background:#158f5a;
color:white;
font-weight:bold;
cursor:pointer;
}

small{
color:#777;
}
</style>
</head>

<body>

<nav>
<div>♻ Smart Waste City</div>
<div>
    <a href="home.html">Home</a>
    <a href="report.html">Report Waste</a>
    <a href="binstatus.html">Bin Status</a>
    <a href="recycle.html">Recycle Bin</a>
    <a href="login.html">Admin</a>
</div>
</nav>

<h2>City Bin Status — Citizen Upload Only</h2>

<div class="grid" id="grid"></div>

<script>
/* ===== AREAS & BIN TYPES ===== */
const areas = [
"MIDC Area",
"VP College Area",
"TC College Area",
"Railway Station",
"Bus Stop",
"Kasba Area",
"Silver Jubilee Hospital"
];
const types = ["Dry Waste","Wet Waste","Plastic Waste"];

/* ===== INIT BINS ===== */
let bins = JSON.parse(localStorage.getItem("cityBins")) || [];
if(bins.length === 0){
  let id = 3001;
  areas.forEach(area=>{
    types.forEach(type=>{
      bins.push({
        id:"BINID-"+id++,
        area:area,
        type:type,
        status:"Empty", // Admin only
        image:"",       // Uploaded by citizen
        date:""
      });
    });
  });
  localStorage.setItem("cityBins", JSON.stringify(bins));
}

/* ===== SAVE ===== */
function save(){
  localStorage.setItem("cityBins", JSON.stringify(bins));
  render();
}

/* ===== RENDER BINS ===== */
function render(){
  const grid = document.getElementById("grid");
  grid.innerHTML = "";

  bins.forEach((b,i)=>{
    grid.innerHTML += `
    <div class="card">
      <div class="binid">${b.id}</div>
      <div class="area">${b.area}</div>
      <div class="type">${b.type}</div>
      <div class="status">Status: ${b.status}</div>
      <small>Last Update: ${b.date || "Not updated"}</small>

      <input type="file" accept="image/*" onchange="uploadPhoto(event,${i})">
      ${b.image ? `<img src="${b.image}">` : ""}
      <small>Citizen Upload Only — Admin updates status</small>
    </div>
    `;
  });
}

/* ===== CITIZEN IMAGE UPLOAD ===== */
function uploadPhoto(e,i){
  const file = e.target.files[0];
  if(!file) return;

  const reader = new FileReader();
  reader.onload = function(){
    bins[i].image = reader.result;
    bins[i].date = new Date().toLocaleString();
    save();
  };
  reader.readAsDataURL(file);
}

render();
</script>

</body>
</html>
